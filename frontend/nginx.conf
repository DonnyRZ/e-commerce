server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # The CMS is a separate frontend container, mounted at the stable /admin
    # path through the storefront gateway. Keep the exact login URL served
    # directly so it never redirects through an insecure absolute URL.
    location = /admin {
        proxy_pass http://cms:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cache-Control "no-store";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        proxy_pass http://cms:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cache-Control "no-store";
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the original protocol from the host Nginx proxy. The
        # frontend container receives plain HTTP internally, but the public
        # request is HTTPS and the API must not redirect it back to itself.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
