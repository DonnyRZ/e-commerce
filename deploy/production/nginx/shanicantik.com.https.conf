# Final HTTPS vhosts. Certbot manages the certificate files.
# Keep the existing junix.tech vhost untouched.
server {
    listen 80;
    listen [::]:80;
    server_name shanicantik.com www.shanicantik.com;

    location /.well-known/acme-challenge/ {
        root /var/www/marketplace/shared/acme;
        try_files $uri =404;
    }

    return 301 https://shanicantik.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.shanicantik.com;

    ssl_certificate /etc/letsencrypt/live/shanicantik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanicantik.com/privkey.pem;

    return 301 https://shanicantik.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shanicantik.com;

    ssl_certificate /etc/letsencrypt/live/shanicantik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanicantik.com/privkey.pem;

    client_max_body_size 15m;

    location ^~ /api/v1/admin/cms/media {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
