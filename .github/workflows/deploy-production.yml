name: Deploy production

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: Confirm off-server backups when this release changes database or media storage
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy selected commit to VPS
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/deployment-marketplace'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shanicantik.com
    timeout-minutes: 35
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare immutable release archive
        id: release
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The selected commit SHA is invalid."
            exit 1
          fi
          archive="$RUNNER_TEMP/$DEPLOY_SHA.tar.gz"
          git archive --format=tar.gz --output="$archive" "$DEPLOY_SHA"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$DEPLOY_SHA.tar.gz" > "$DEPLOY_SHA.tar.gz.sha256"
          )
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH access
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          for name in VPS_DEPLOY_KEY VPS_KNOWN_HOSTS VPS_HOST; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Deployment secret $name is missing (repository or production environment)."
              exit 1
            fi
          done
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/marketplace_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/marketplace_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Detect database and media changes
        id: data_changes
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$HOME/.ssh/marketplace_deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          target="$VPS_USER@$VPS_HOST"
          current_release="$(ssh "${ssh_options[@]}" "$target" "readlink -f /var/www/marketplace/current")"
          current_sha="${current_release##*/}"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot identify the currently deployed release; refusing to skip the data-backup check."
            exit 1
          fi
          if ! git cat-file -e "$current_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$current_sha"
          fi
          if ! git cat-file -e "$current_sha^{commit}" 2>/dev/null; then
            echo "::error::The currently deployed commit is unavailable for change comparison."
            exit 1
          fi
          sensitive_paths=(backend/alembic backend/db/models.py backend/storage deploy/production/docker-compose.yml deploy/production/deploy.sh backend/scripts/ensure_admin_push_keys.py)
          changed_paths="$(git diff --name-only "$current_sha" "$DEPLOY_SHA" -- "${sensitive_paths[@]}")"
          if [[ -n "$changed_paths" ]]; then
            echo "requires_backup=true" >> "$GITHUB_OUTPUT"
            echo "Database or media storage files changed since the deployed release:"
            printf '%s\n' "$changed_paths"
          else
            echo "requires_backup=false" >> "$GITHUB_OUTPUT"
            echo "No database or media storage changes; an off-server backup confirmation is not required for this release."
          fi

      - name: Require verified off-server backups for data changes
        env:
          REQUIRES_BACKUP: ${{ steps.data_changes.outputs.requires_backup }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          set -euo pipefail
          if [[ "$REQUIRES_BACKUP" != "true" ]]; then
            echo "Skipping manual backup confirmation; this release has no database or media storage changes."
          elif [[ "$BACKUP_CONFIRMED" != "true" ]]; then
            echo "::error::This release changes database or media storage. Verify off-server backups before deploying it."
            exit 1
          else
            echo "Off-server backup confirmation received for database or media storage changes."
          fi

      - name: Upload release and deploy
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_USER" ]]; then
            echo "::error::Deployment secret VPS_USER is missing (repository or production environment)."
            exit 1
          fi
          ssh_options=(-i "$HOME/.ssh/marketplace_deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          target="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$target" "mkdir -p /var/www/marketplace/incoming"
          scp "${ssh_options[@]}" "${{ steps.release.outputs.archive }}" "$target:/var/www/marketplace/incoming/$DEPLOY_SHA.tar.gz"
          scp "${ssh_options[@]}" "${{ steps.release.outputs.archive }}.sha256" "$target:/var/www/marketplace/incoming/$DEPLOY_SHA.tar.gz.sha256"
          ssh "${ssh_options[@]}" "$target" "sudo -n /usr/local/sbin/marketplace-deploy $DEPLOY_SHA"
