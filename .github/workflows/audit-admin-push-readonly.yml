name: Read-only admin push audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - name: Prepare password authentication and pinned host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          for name in VPS_KNOWN_HOSTS VPS_HOST; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production secret $name is missing."
              exit 1
            fi
          done
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Read push queue and device stages
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD_1 || secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SSHPASS" ]]; then
            echo "::error::The production root password secret is missing."
            exit 1
          fi
          ssh_options=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          sshpass -e ssh "${ssh_options[@]}" "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'audit_time_utc='; date -u -Is
          printf 'active_release='; readlink -f /var/www/marketplace/current
          docker inspect --format '{{.Name}} restart={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}}' marketplace-backend-1 marketplace-cms-1
          docker exec marketplace-backend-1 python -c 'from admin_push import ADMIN_PUSH_ENABLED, public_key; print("push_enabled=%s vapid_key_ready=%s" % (ADMIN_PUSH_ENABLED, bool(public_key())))'

          echo 'recent_telegram_push_events:'
          docker exec -i marketplace-backend-1 python - <<'PY'
          import asyncio
          import hashlib
          from datetime import timedelta
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo
          from sqlalchemy import select
          from db.models import AdminPushDelivery, AdminPushSubscription, TelegramInboxMessage, TelegramUpdateReceipt, utcnow
          from db.session import SessionLocal

          WIB = ZoneInfo("Asia/Jakarta")

          def stamp(value):
              return value.isoformat() if value is not None else "none"

          async def main():
              since = utcnow() - timedelta(hours=3)
              async with SessionLocal() as session:
                  rows = (await session.execute(
                      select(TelegramInboxMessage.id, TelegramInboxMessage.created_at, TelegramInboxMessage.update_id)
                      .where(
                          TelegramInboxMessage.direction == "inbound",
                          TelegramInboxMessage.source == "telegram",
                          TelegramInboxMessage.created_at >= since,
                      )
                      .order_by(TelegramInboxMessage.created_at.desc())
                      .limit(30)
                  )).all()
                  if not rows:
                      print("recent_telegram_inbound_messages=0")
                  for index, (message_id, message_at, update_id) in enumerate(reversed(rows), 1):
                      receipt = await session.get(TelegramUpdateReceipt, update_id) if update_id is not None else None
                      deliveries = (await session.execute(
                          select(
                              AdminPushDelivery.id,
                              AdminPushDelivery.created_at,
                              AdminPushDelivery.status,
                              AdminPushDelivery.attempts,
                              AdminPushDelivery.last_status,
                              AdminPushDelivery.subscription_id,
                              AdminPushSubscription.endpoint,
                              AdminPushDelivery.payload["tag"].as_string().label("notification_tag"),
                              AdminPushDelivery.payload["_audit"]["device_stages"].label("device_stages"),
                              AdminPushDelivery.payload["_audit"]["telegram_fallback"].label("telegram_fallback"),
                          ).join(AdminPushSubscription, AdminPushSubscription.id == AdminPushDelivery.subscription_id)
                          .where(AdminPushDelivery.event_key == f"telegram-message:{message_id}")
                      )).all()
                      if not deliveries:
                          detail = "no_delivery_row"
                      else:
                          detail = ";".join(
                              "delivery_id=%s device=%s provider_host=%s tag_hash=%s queue_utc=%s queue_delay_s=%s status=%s attempts=%s provider_http=%s device_stages=%s telegram_fallback=%s"
                              % (
                                  item.id,
                                  item.subscription_id[:12],
                                  urlparse(item.endpoint).hostname,
                                  hashlib.sha256((item.notification_tag or "").encode()).hexdigest()[:12],
                                  stamp(item.created_at),
                                  max(0, int((item.created_at - message_at).total_seconds())),
                                  item.status,
                                  item.attempts,
                                  item.last_status,
                                  item.device_stages or {},
                                  item.telegram_fallback or {},
                              )
                              for item in deliveries
                          )
                      print(
                          "telegram_event_%02d message_utc=%s message_wib=%s webhook_receipt=%s %s"
                          % (
                              index,
                              stamp(message_at),
                              message_at.astimezone(WIB).strftime("%Y-%m-%dT%H:%M:%S%z"),
                              receipt.status if receipt else "missing",
                              detail,
                          )
                      )

          asyncio.run(main())
          PY

          echo 'push_dispatch_provider_and_device_stages:'
          docker logs --since 3h --timestamps marketplace-backend-1 2>&1 | grep -E 'admin_push_(dispatch_started|provider_accepted|device_stage|delivery_failed|telegram_backup_sent|telegram_backup_failed)' | tail -n 300 || true

          echo 'notification_resource_and_worker_requests:'
          python3 - <<'PY'
          from collections import deque
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re
          import subprocess

          paths = {
              "/api/v1/admin/push/delivery-ack",
              "/admin/cms-sw.js",
              "/admin/pwa/icon-192.png",
              "/admin/pwa/badge-96.png",
              "/admin/settings",
              "/admin/telegram-inbox",
          }
          since = datetime.now(timezone.utc) - timedelta(hours=2)
          pattern = re.compile(r'\[([^\]]+)\] "(?:GET|POST) ([^ ]+) [^"]+" (\d{3}) \S+ "[^"]*" "([^"]*)"')
          sources = []
          host_log = Path("/var/log/nginx/access.log")
          if host_log.is_file():
              with host_log.open(errors="replace") as stream:
                  sources.append(("host", deque(stream, maxlen=20000)))
          for name in ("marketplace-storefront-1", "marketplace-cms-1"):
              result = subprocess.run(["docker", "logs", "--since", "2h", name], capture_output=True, text=True)
              sources.append((name, result.stdout.splitlines()))
          for source, lines in sources:
              found = []
              for line in lines:
                  match = pattern.search(line)
                  if not match:
                      continue
                  at, url, status, agent = match.groups()
                  path = url.split("?", 1)[0]
                  if path not in paths:
                      continue
                  try:
                      stamp = datetime.strptime(at, "%d/%b/%Y:%H:%M:%S %z")
                  except ValueError:
                      continue
                  if stamp >= since:
                      found.append("http_source=%s at_utc=%s path=%s status=%s agent=%s" % (source, stamp.astimezone(timezone.utc).isoformat(), path, status, agent[:180]))
              print("\n".join(found[-80:]) if found else "http_source=%s relevant_requests=0" % source)
          PY
          REMOTE
