name: Temporary read-only VPS root audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - name: Prepare password authentication and pinned host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          for name in VPS_KNOWN_HOSTS VPS_HOST; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required production secret $name is missing."
              exit 1
            fi
          done
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Read VPS, webhook, push queue and filtered errors
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD_1 || secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SSHPASS" ]]; then
            echo "::error::Add the candidate password as VPS_ROOT_PASSWORD_1 in the production environment."
            exit 1
          fi
          ssh_options=(-o BatchMode=no -o PubkeyAuthentication=no -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          target="root@$VPS_HOST"
          sshpass -e ssh "${ssh_options[@]}" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'audit_time='; date -Is
          printf 'host='; hostname
          printf 'active_release='; readlink -f /var/www/marketplace/current
          printf 'uptime='; uptime -p
          echo 'memory:'; free -h
          echo 'root_disk:'; df -hP / | tail -n 1

          echo 'containers:'
          docker ps --filter name=marketplace --format '{{.Names}} | {{.Status}} | {{.RunningFor}}'
          docker stats --no-stream --format '{{.Name}} | CPU {{.CPUPerc}} | MEM {{.MemUsage}}' marketplace-backend-1 marketplace-cms-1 marketplace-nginx-1 2>/dev/null || true

          echo 'push_runtime:'
          docker exec marketplace-backend-1 python -c 'from admin_push import ADMIN_PUSH_ENABLED, public_key; print("enabled=%s vapid_key_ready=%s" % (ADMIN_PUSH_ENABLED, bool(public_key())))'

          echo 'telegram_webhook_readiness:'
          docker exec marketplace-backend-1 python scripts/register_telegram_webhook.py --check || echo 'webhook_check_exit=nonzero'

          echo 'push_delivery_counts_last_24h:'
          docker exec -i marketplace-backend-1 python - <<'PY'
          import asyncio
          from datetime import timedelta
          from sqlalchemy import func, select
          from db.models import (
              AdminPushDelivery,
              AdminPushSubscription,
              TelegramInboxMessage,
              TelegramUpdateReceipt,
              User,
              utcnow,
          )
          from db.session import SessionLocal

          async def main():
              since = utcnow() - timedelta(hours=24)
              kind = AdminPushDelivery.payload["kind"].as_string()
              query = (
                  select(
                      kind.label("kind"),
                      AdminPushDelivery.status,
                      AdminPushDelivery.last_status,
                      func.count(),
                      func.max(AdminPushDelivery.attempts),
                      func.min(AdminPushDelivery.created_at),
                  )
                  .where(AdminPushDelivery.created_at >= since)
                  .group_by(kind, AdminPushDelivery.status, AdminPushDelivery.last_status)
                  .order_by(kind, AdminPushDelivery.status, AdminPushDelivery.last_status)
              )
              async with SessionLocal() as session:
                  inbound = await session.scalar(
                      select(func.count())
                      .select_from(TelegramInboxMessage)
                      .where(
                          TelegramInboxMessage.direction == "inbound",
                          TelegramInboxMessage.created_at >= since,
                      )
                  )
                  eligible = await session.scalar(
                      select(func.count())
                      .select_from(AdminPushSubscription)
                      .join(User, User.id == AdminPushSubscription.user_id)
                      .where(
                          AdminPushSubscription.enabled.is_(True),
                          User.is_active.is_(True),
                          User.role == "admin",
                          AdminPushSubscription.token_version == User.token_version,
                      )
                  )
                  receipts = await session.execute(
                      select(TelegramUpdateReceipt.status, func.count())
                      .where(TelegramUpdateReceipt.received_at >= since)
                      .group_by(TelegramUpdateReceipt.status)
                      .order_by(TelegramUpdateReceipt.status)
                  )
                  deliveries = (await session.execute(query)).all()
                  receipt_rows = receipts.all()
              print(f"telegram_inbound_messages_last_24h={inbound or 0}")
              print(f"eligible_admin_devices={eligible or 0}")
              for status, count in receipt_rows:
                  print(f"telegram_webhook_receipts status={status} count={count}")
              for row in deliveries:
                  age = max(0, int((utcnow() - row[5]).total_seconds() // 60))
                  print(
                      "kind=%s status=%s last_http=%s count=%s max_attempts=%s oldest_created_minutes=%s"
                      % (row[0], row[1], row[2], row[3], row[4], age)
                  )

          asyncio.run(main())
          PY

          echo 'recent_push_errors:'
          docker logs --since 24h marketplace-backend-1 2>&1 | grep -E 'admin_push_delivery_failed|admin_push_dispatch_unavailable|telegram_webhook_processing_failed' | tail -n 100 || true
          REMOTE
