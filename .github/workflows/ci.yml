name: CI

on:
  push:
    branches: [main, codex/deployment-marketplace]
  pull_request:
    branches: [main, codex/deployment-marketplace]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: uv pip install --system -r backend/requirements.lock
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Backend smoke script syntax
        run: python -m py_compile backend/scripts/smoke_local.py
      - name: Backend unit tests
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://marketplace:marketplace@localhost:55433/marketplace
          JWT_SECRET: isolated-ci-key-at-least-32-characters
          ADMIN_PUSH_ENABLED: "false"
          RATE_LIMIT_BACKEND: memory
        run: python -m unittest discover -s unit_tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test:ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: CMS production build
        working-directory: frontend
        run: npm run build:cms

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: docker compose up -d --build
      - name: Wait for isolated application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1
      - name: Bootstrap isolated operator and content
        run: |
          docker compose exec -T -e SEED_ADMIN_EMAIL=operator@example.com -e SEED_ADMIN_PASSWORD='AdminPass123!' -e SEED_CUSTOMER_EMAIL=customer@example.com -e SEED_CUSTOMER_PASSWORD='CustomerPass123!' backend python seed_accounts.py
          docker compose exec -T -e STORE_OWNER_EMAIL=operator@example.com backend python seed_catalog.py
          docker compose exec -T backend python seed_cms.py
      - name: Run API smoke test
        run: docker compose exec -T -e API_BASE=http://backend:8000 -e SMOKE_ADMIN_EMAIL=operator@example.com -e SMOKE_ADMIN_PASSWORD='AdminPass123!' backend python scripts/smoke_local.py
      - name: Device push integration tests
        run: docker compose exec -T -e APP_ENV=test -e ADMIN_PUSH_ENABLED=false -e RATE_LIMIT_BACKEND=memory backend python -m unittest discover -s integration_tests -v
      - name: Seed synthetic mobile audit data
        run: docker compose exec -T backend python scripts/seed_mobile_audit.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: CMS mobile, install and notification browser tests
        working-directory: frontend
        env:
          CMS_AUDIT_WIDTHS: "390,320"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:browser
      - name: Save CMS screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-mobile-audit
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down isolated stack
        if: always()
        run: docker compose down -v
