name: Diagnostic CMS push to one device
'on':
  workflow_dispatch:
    inputs:
      device_prefix:
        description: "12\u201332 hex characters identifying exactly one active admin subscription"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cms-push-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
    - name: Prepare password authentication and pinned host key
      env:
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        VPS_HOST: ${{ secrets.VPS_HOST }}
      run: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y -qq sshpass\nfor name in VPS_KNOWN_HOSTS VPS_HOST;\
        \ do\n  if [[ -z \"${!name}\" ]]; then\n    echo \"::error::Required production secret $name is missing.\"\n    exit\
        \ 1\n  fi\ndone\ninstall -m 0700 -d \"$HOME/.ssh\"\nprintf '%s\\n' \"$VPS_KNOWN_HOSTS\" > \"$HOME/.ssh/known_hosts\"\
        \nchmod 0600 \"$HOME/.ssh/known_hosts\"\nssh-keygen -F \"$VPS_HOST\" -f \"$HOME/.ssh/known_hosts\" >/dev/null\n"
    - name: Queue one clearly labeled diagnostic notification and read acknowledgments
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD_1 || secrets.VPS_ROOT_PASSWORD }}
        DEVICE_PREFIX: ${{ inputs.device_prefix }}
      run: "set -euo pipefail\nif [[ -z \"$SSHPASS\" || ! \"$DEVICE_PREFIX\" =~ ^[a-f0-9]{12,32}$ ]]; then\n  echo \"::error::A\
        \ password secret and a valid exact device prefix are required.\"\n  exit 1\nfi\nssh_options=(-o BatchMode=no -o PubkeyAuthentication=no\
        \ -o PreferredAuthentications=password -o NumberOfPasswordPrompts=1 -o ConnectTimeout=10 -o StrictHostKeyChecking=yes\
        \ -o UserKnownHostsFile=\"$HOME/.ssh/known_hosts\")\nsshpass -e ssh \"${ssh_options[@]}\" \"root@$VPS_HOST\" \"DEVICE_PREFIX=$DEVICE_PREFIX\
        \ bash -s\" <<'REMOTE'\nset -euo pipefail\ndocker exec -i -e DEVICE_PREFIX=\"$DEVICE_PREFIX\" marketplace-backend-1\
        \ python - <<'PYTHON'\nimport asyncio\nimport json\nimport os\nfrom sqlalchemy import select\nfrom admin_push import\
        \ enqueue_admin_notification\nfrom db.models import AdminPushDelivery, AdminPushSubscription, User, uid, utcnow\n\
        from db.session import SessionLocal\n\nasync def main():\n    async with SessionLocal() as session:\n        devices\
        \ = (await session.scalars(\n            select(AdminPushSubscription).join(User, User.id == AdminPushSubscription.user_id)\n\
        \            .where(AdminPushSubscription.id.startswith(os.environ[\"DEVICE_PREFIX\"]),\n                   AdminPushSubscription.enabled.is_(True),\
        \ User.is_active.is_(True),\n                   User.role == \"admin\", AdminPushSubscription.token_version == User.token_version)\n\
        \        )).all()\n        if len(devices) != 1:\n            raise RuntimeError(\"The prefix must identify exactly\
        \ one active admin device\")\n        event_key = \"diagnostic:\" + uid()\n        count = await enqueue_admin_notification(session,\
        \ event_key, \"test\", \"/admin/settings\", subscription_id=devices[0].id)\n        if count != 1:\n            raise\
        \ RuntimeError(\"Push is not configured for the selected device\")\n        row = await session.scalar(select(AdminPushDelivery).where(AdminPushDelivery.event_key\
        \ == event_key))\n        row.payload = {**row.payload, \"title\": \"Uji notifikasi CMS\", \"body\": \"Uji audit pada\
        \ \" + utcnow().strftime(\"%H:%M:%S UTC\") + \". Ini notifikasi diagnostik.\"}\n        delivery_id = row.id\n   \
        \     queued = row.created_at\n        await session.commit()\n        print(\"diagnostic_delivery_id=\" + delivery_id\
        \ + \" queued_at_utc=\" + queued.isoformat(), flush=True)\n    previous = None\n    for attempt in range(70):\n  \
        \      async with SessionLocal() as session:\n            row = await session.get(AdminPushDelivery, delivery_id)\n\
        \            audit = (row.payload or {}).get(\"_audit\", {})\n            safe = {\"status\": row.status, \"provider_http\"\
        : row.last_status,\n                    \"device_stages\": audit.get(\"device_stages\", {}),\n                   \
        \ \"device_timings\": audit.get(\"device_timings\", {})}\n            report = json.dumps(safe, sort_keys=True)\n\
        \            if report != previous:\n                print(\"diagnostic_observed_at_utc=\" + utcnow().isoformat()\
        \ + \" \" + report, flush=True)\n                previous = report\n            if \"notification_show_resolved\"\
        \ in safe[\"device_stages\"]:\n                print(\"display_ack_elapsed_s=\" + str(round((utcnow() - queued).total_seconds(),\
        \ 3)), flush=True)\n                return\n        await asyncio.sleep(1)\n    print(\"display_ack_missing_after_70s=true;\
        \ provider acceptance is not proof of device display\", flush=True)\n\nasyncio.run(main())\nPYTHON\nREMOTE\n"
